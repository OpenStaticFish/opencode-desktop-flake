name: Update flake.lock

on:
  schedule:
    # Run every Monday at 4:00 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v24
        with:
          pr-title: "chore: update flake.lock"
          pr-body: |
            Automated update of `flake.lock`.
            
            This PR was generated automatically by the update-flake-lock workflow.
            Please review the changes before merging.
          commit-msg: "chore: update flake.lock"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh pr list --head update_flake_lock_action --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open update-flake-lock pull request found; nothing to merge"
            exit 0
          fi
          echo "Squash-merging flake.lock PR #$pr_number"
          if ! gh pr merge "$pr_number" --squash --delete-branch; then
            echo "::warning::Could not auto-merge PR #$pr_number. Merge it manually."
          fi
