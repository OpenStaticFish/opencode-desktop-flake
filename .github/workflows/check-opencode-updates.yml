name: Check for OpenCode Desktop updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-desktop-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Test update logic
        run: python3 -m unittest discover -s tests -v

      - name: Check for latest stable OpenCode v2 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_opencode.py
          git diff flake.nix

      - name: Validate updated package
        run: |
          if git diff --quiet flake.nix; then
            echo "No changes to validate"
            exit 0
          fi

          nix flake check --no-build --all-systems
          wrapped=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.default)
          unwrapped=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.unwrapped)
          version=$(nix eval --raw .#packages.x86_64-linux.unwrapped.version)
          bash scripts/check_package.sh "$wrapped" "$unwrapped" x86_64-linux "$version"

      - name: Create update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump opencode-desktop"
          title: "chore: bump opencode-desktop"
          body: |
            Automated OpenCode Desktop v2 update.

            Validation run before this PR was created:
            - `python3 -m unittest discover -s tests -v`
            - `nix flake check --no-build --all-systems`
            - Built and checked both x86_64 Linux package outputs
          branch: update/opencode-desktop
          delete-branch: true

      - name: Auto-merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.cpr.outputs.pull-request-number }}"
          if [ -z "$pr_number" ]; then
            echo "No pull request was created; nothing to merge"
            exit 0
          fi
          echo "Squash-merging PR #$pr_number (already validated by nix build above)"
          if ! gh pr merge "$pr_number" --squash --delete-branch; then
            echo "::warning::Could not auto-merge PR #$pr_number (branch protection or repo settings may block it). Merge it manually."
          fi
